# =========================================================
#  サイト全体の設定 (Site-wide settings)
#  ここを変更すると、サイト全体に反映されます。
# =========================================================

# 会社名（ヘッダー左上に表示）
company_name: "JIYU Laboratories, Inc."

# ヘッダー下のキャッチコピー
tagline: "研究者を、もっとジユウに！"

# ブラウザのタブ・検索結果に表示されるタイトルと説明文
title: "JIYU Laboratories, Inc."
description: "株式会社JIYU Laboratoriesは、学術情報の解析ツール、電子実験ノート「Jikken Note」、受託開発・調査/コンサルティングを通じて、研究開発エコシステムを活性化するお手伝いをします。"

# SNSでシェアされた時に表示される画像
og_image: /assets/images/og-image.jpg

# Google Search Console の所有権確認（変更しないでください）
google_site_verification: "VjewR32LL0noKyy8CGvKhz08ZNm3ez2hc8Kv8xb4wbw"

# =========================================================
#  ここから下は技術的な設定です。通常は変更不要です。
# =========================================================
lang: ja
url: "https://jiyu-labs.com"
# baseurl は GitHub Pages が自動で設定します（空欄のままにしてください）

collections:
  sections:
    output: false
  services:
    output: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true   # 改行がそのまま改行として表示されます

exclude:
  - README.md
  - EDITING.md
  - reference/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
