<!doctype html>
<html lang="{{ site.lang | default: 'ja' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }} | {{ site.tagline }}</title>
  <meta name="description" content="{{ site.description | strip_newlines | escape }}">
  <meta name="google-site-verification" content="{{ site.google_site_verification }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ site.title }} | {{ site.tagline }}">
  <meta property="og:description" content="{{ site.description | strip_newlines | escape }}">
  <meta property="og:url" content="{{ site.url }}/">
  <meta property="og:image" content="{{ site.url }}{{ site.og_image }}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body id="top">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" href="{{ '/' | relative_url }}">{{ site.company_name }}</a>
      <nav class="site-nav" aria-label="メインメニュー">
        {% assign nav_sections = site.sections | sort: "order" %}
        {% for s in nav_sections %}{% if s.nav and s.hidden != true %}
        <a href="#{{ s.anchor }}">{{ s.nav }}</a>
        {% endif %}{% endfor %}
      </nav>
    </div>
    <p class="site-tagline">― {{ site.tagline }} ―</p>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <a class="to-top" href="#top">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z" fill="currentColor"/></svg>
      <span>Top of the page</span>
    </a>
    <p class="copyright">© {{ 'now' | date: '%Y' }} {{ site.company_name }}</p>
  </footer>
</body>
</html>
